services:

  # ── PHP Application (Laravel + Nginx) ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dcs_app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ./docker/php/conf.d/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dcs_net

  # ── Node / Vite ─────────────────────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: dcs_node
    working_dir: /app
    environment:
      DOCKER: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "[ -d node_modules/.bin ] || npm install && npm run dev"
    networks:
      - dcs_net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dcs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_control_system
      POSTGRES_USER: dcs_user
      POSTGRES_PASSWORD: dcs_password
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcs_user -d document_control_system"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - dcs_net

  # ── Adminer ─────────────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: dcs_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - dcs_net

volumes:
  pg_data:
  vendor:
  node_modules:

networks:
  dcs_net:
    driver: bridge