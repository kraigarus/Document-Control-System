services:
    apache:
        image: httpd:2.4-alpine
        container_name: dcs_apache
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/apache/000-default.conf:/usr/local/apache2/conf/extra/dcs.conf
        depends_on:
            app:
                condition: service_started
        networks:
            - dcs-network
        command: >
            sh -c "
            sed -i 's|#LoadModule proxy_module modules/mod_proxy.so|LoadModule proxy_module modules/mod_proxy.so|' /usr/local/apache2/conf/httpd.conf &&
            sed -i 's|#LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so|LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so|' /usr/local/apache2/conf/httpd.conf &&
            sed -i 's|#LoadModule rewrite_module modules/mod_rewrite.so|LoadModule rewrite_module modules/mod_rewrite.so|' /usr/local/apache2/conf/httpd.conf &&
            sed -i 's|#Include conf/extra/httpd-vhosts.conf|Include conf/extra/dcs.conf|' /usr/local/apache2/conf/httpd.conf &&
            httpd-foreground
            "

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dcs_app
        restart: unless-stopped
        env_file: .env
        volumes:
            # Bind-mount source — changes reflect instantly without rebuilding
            - .:/var/www/html
            # Named volume for vendor/ so it stays inside the container
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - dcs-network

    mysql:
        image: mysql:8.4
        container_name: dcs_mysql
        ports:
            - "3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: document_control_system
            MYSQL_USER: dcs_user
            MYSQL_PASSWORD: dcs_password
        volumes:
            - dcs-mysql:/var/lib/mysql
        networks:
            - dcs-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: dcs_phpmyadmin
        ports:
            - "8001:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: rootpassword
        depends_on:
            - mysql
        networks:
            - dcs-network

networks:
    dcs-network:
        driver: bridge
volumes:
    dcs-mysql:
        driver: local
    vendor:
        driver: local
